spring.application.name=nexacro-inventory-api
spring.profiles.default=dev
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.encoding=UTF-8
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.error.include-message=never
server.tomcat.connection-timeout=15s
app.upload-dir=./uploads
app.public-base-url=http://localhost:8080
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*,null
logging.level.org.springframework=WARN
logging.level.com.psi.training.nexacro.xapi=INFO
